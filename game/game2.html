<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocokkan Kartu Isyarat — Game 2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Poppins',sans-serif;}
  .font-heading{font-family:'Baloo 2',cursive;}
  .nav-pill{transition:transform .15s ease;}
  .nav-pill:hover{transform:translateY(-2px);}
  .card-scene{perspective:1000px;}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;}
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:1rem;display:flex;align-items:center;justify-content:center;}
  .card-back{background:linear-gradient(135deg,#FB923C,#F59E0B);}
  .card-front{background:#fff;transform:rotateY(180deg);}
  .card.matched .card-front{background:#DCFCE7;}
  .confetti{position:fixed;top:-10px;width:10px;height:10px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-yellow-50 via-orange-50 to-amber-100">

<div id="confetti-container" class="pointer-events-none fixed inset-0 overflow-hidden z-50"></div>

<div class="min-h-screen flex flex-col">
  <header class="px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
    <span class="font-heading text-xl md:text-2xl font-bold text-orange-700">🖐️ BelajarIsyarat</span>
    <nav class="flex gap-2 text-sm overflow-x-auto">
      <a href="game1.html" class="nav-pill px-3 py-1.5 rounded-full bg-white border-2 border-orange-200 text-orange-700 font-bold whitespace-nowrap">1. Tebak Huruf</a>
      <a href="game2.html" class="nav-pill px-3 py-1.5 rounded-full bg-orange-500 text-white font-bold whitespace-nowrap">2. Cocokkan</a>
      <a href="game3.html" class="nav-pill px-3 py-1.5 rounded-full bg-white border-2 border-orange-200 text-orange-700 font-bold whitespace-nowrap">3. Susun Kata</a>
      <a href="game4.html" class="nav-pill px-3 py-1.5 rounded-full bg-white border-2 border-orange-200 text-orange-700 font-bold whitespace-nowrap">4. Mode Cepat</a>
      <a href="game5.html" class="nav-pill px-3 py-1.5 rounded-full bg-white border-2 border-orange-200 text-orange-700 font-bold whitespace-nowrap">5. Benar/Salah</a>
    </nav>
  </header>

  <main class="flex-1 flex items-start justify-center px-4 pb-10">
    <div class="w-full max-w-xl">

      <div class="mt-2 mb-4 flex justify-between items-center text-orange-800 font-bold">
        <span id="moves-label">Langkah: 0</span>
        <h1 class="font-heading text-lg md:text-xl text-orange-800">Cocokkan isyarat dengan hurufnya!</h1>
        <span id="pairs-label">0 / 6 pasang</span>
      </div>

      <section id="game-card" class="bg-white rounded-3xl shadow-lg border-4 border-orange-200 p-4 md:p-6">
        <div id="board" class="grid grid-cols-3 sm:grid-cols-4 gap-3"></div>
      </section>

      <section id="end-card" class="hidden bg-white rounded-3xl shadow-lg border-4 border-orange-200 p-8 text-center">
        <p class="text-5xl mb-3">🎉</p>
        <h2 class="font-heading text-2xl font-bold text-orange-800 mb-2">Semua pasangan ketemu!</h2>
        <p id="end-summary" class="text-lg text-orange-700 font-bold mb-6"></p>
        <button id="restart-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-heading font-bold text-lg rounded-2xl py-3">Main Lagi 🔁</button>
      </section>

      <p class="text-center text-orange-700/70 text-sm leading-relaxed mt-4">Catatan: gambar tangan adalah ilustrasi contoh. Ganti dengan foto isyarat BISINDO/SIBI asli untuk penggunaan nyata.</p>
    </div>
  </main>
</div>

<script>
const SIGNS = [
  { letter: 'A', pattern: [1,0,0,0,0] },
  { letter: 'B', pattern: [0,1,1,1,1] },
  { letter: 'C', pattern: [1,1,0,0,0] },
  { letter: 'D', pattern: [0,1,0,0,0] },
  { letter: 'E', pattern: [0,0,0,0,0] },
  { letter: 'F', pattern: [1,0,1,1,1] },
];

function handSVG(pattern, size=90){
  const cols = [40, 66, 92, 118];
  let fingers = '';
  [1,2,3,4].forEach((idx, i) => {
    const up = pattern[idx];
    const h = up ? 66 : 20;
    const y = 100 - h;
    fingers += `<rect x="${cols[i]-9}" y="${y}" width="18" height="${h}" rx="9" fill="#FFEDD5" stroke="#C2410C" stroke-width="2.5"/>`;
  });
  const thumbUp = pattern[0];
  const thumbH = thumbUp ? 54 : 20;
  fingers += `<rect x="4" y="${120-thumbH}" width="18" height="${thumbH}" rx="9" fill="#FFEDD5" stroke="#C2410C" stroke-width="2.5" transform="rotate(-35 13 120)"/>`;
  return `<svg viewBox="0 0 160 190" width="${size}" height="${size*1.18}" xmlns="http://www.w3.org/2000/svg">
    <rect x="18" y="100" width="124" height="82" rx="28" fill="#FB923C" stroke="#C2410C" stroke-width="3.5"/>
    ${fingers}
  </svg>`;
}

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function confettiBurst(){
  const colors = ['#FB923C','#FACC15','#F97316','#FDE047','#EA580C'];
  const $c = $('#confetti-container').empty();
  for(let i=0;i<60;i++){
    $('<div class="confetti"></div>').css({
      left: (Math.random()*100)+'vw',
      background: colors[Math.floor(Math.random()*colors.length)],
      animationDuration: (1.6+Math.random()*1.2)+'s',
      animationDelay: (Math.random()*0.4)+'s'
    }).appendTo($c);
  }
  setTimeout(()=>$c.empty(), 3200);
}

let moves = 0, matchedPairs = 0, lock = false, first = null;

function buildDeck(){
  let cards = [];
  SIGNS.forEach((s, i) => {
    cards.push({ pairId: i, type: 'hand', letter: s.letter, pattern: s.pattern });
    cards.push({ pairId: i, type: 'letter', letter: s.letter });
  });
  return shuffle(cards);
}

function renderBoard(){
  moves = 0; matchedPairs = 0; lock = false; first = null;
  $('#moves-label').text('Langkah: 0');
  $('#pairs-label').text(`0 / ${SIGNS.length} pasang`);
  $('#end-card').addClass('hidden');
  $('#game-card').removeClass('hidden');

  const deck = buildDeck();
  const $board = $('#board').empty();
  deck.forEach((card, i) => {
    const frontContent = card.type === 'hand'
      ? handSVG(card.pattern, 70)
      : `<span class="font-heading text-4xl font-bold text-orange-700">${card.letter}</span>`;
    const $card = $(`
      <button class="card card-scene aspect-square" data-index="${i}" data-pair="${card.pairId}" data-type="${card.type}">
        <div class="card-inner">
          <div class="card-face card-back border-2 border-orange-300 flex items-center justify-center">
            <span class="text-white text-2xl">🖐️</span>
          </div>
          <div class="card-face card-front border-2 border-orange-200">${frontContent}</div>
        </div>
      </button>
    `);
    $board.append($card);
  });
}

$(document).on('click', '.card', function(){
  const $card = $(this);
  if(lock || $card.hasClass('flipped') || $card.hasClass('matched')) return;
  $card.addClass('flipped');

  if(!first){
    first = $card;
    return;
  }

  moves++;
  $('#moves-label').text('Langkah: ' + moves);

  const samePair = first.data('pair') === $card.data('pair');
  const differentType = first.data('type') !== $card.data('type');

  if(samePair && differentType){
    first.addClass('matched');
    $card.addClass('matched');
    matchedPairs++;
    $('#pairs-label').text(`${matchedPairs} / ${SIGNS.length} pasang`);
    first = null;
    if(matchedPairs === SIGNS.length){
      setTimeout(() => {
        $('#game-card').addClass('hidden');
        $('#end-card').removeClass('hidden');
        $('#end-summary').text(`Selesai dalam ${moves} langkah!`);
        confettiBurst();
      }, 400);
    }
  } else {
    lock = true;
    const f = first;
    setTimeout(() => {
      f.removeClass('flipped');
      $card.removeClass('flipped');
      lock = false;
      first = null;
    }, 800);
  }
});

$('#restart-btn').on('click', renderBoard);

renderBoard();
</script>
</body>
</html>
