<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Susun Kata</title>
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CDN FontAwesome / Lucide untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        /* Motif Titik-Titik Header */
        .bg-dots {
            background-image: radial-gradient(rgba(255, 255, 255, 0.3) 15%, transparent 15%);
            background-size: 16px 16px;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <section>
      
    </section>
    <div class="w-full max-w-md md:max-w-xl lg:max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden transition-all duration-300">

        <!-- ==================== HALAMAN 1: LOBBY / MENU (DIV) ==================== -->
        <div id="page-lobby" class="w-full block">
            <!-- Header Kartu -->
            <div class="bg-amber-500 bg-dots p-8 md:p-10 text-white relative rounded-b-3xl shadow-md">
                <div class="text-center relative z-10">
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">Test Susun Kata</h1>
                    <p class="text-sm md:text-base font-medium italic opacity-90 mt-1">Kuis Susun Kata Adaptif</p>
                </div>
                <!-- Watermark Tanda Tanya -->
                <div class="absolute right-4 bottom-2 text-amber-600 text-7xl md:text-8xl font-black opacity-30 select-none pointer-events-none">
                    ?
                </div>
            </div>

            <!-- Konten Utama Kartu -->
            <div class="p-6 md:p-8 space-y-6">
                <!-- Info Level & EXP -->
                <div>
                    <span class="text-gray-900 font-bold text-sm md:text-base">Level Saat Ini</span>
                    <div class="flex items-baseline gap-1 mt-1">
                        <span class="text-3xl md:text-4xl font-extrabold text-gray-900">Lv.</span>
                        <span class="text-4xl md:text-5xl font-extrabold text-amber-500">1</span>
                    </div>
                    <div class="text-xs md:text-sm font-semibold text-gray-900 mt-2">
                        EXP: 0 / 30
                    </div>
                    <!-- Progress Bar EXP -->
                    <div class="w-full bg-gray-100 rounded-full h-3.5 mt-2 overflow-hidden border border-amber-200">
                        <div class="bg-gradient-to-r from-amber-400 to-amber-500 h-full rounded-full w-0 transition-all duration-500"></div>
                    </div>
                </div>

                <!-- Tombol Aksi -->
                <div class="space-y-3 pt-2">
                    <button id="btn-start" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-white font-bold py-3.5 px-6 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-base md:text-lg">
                        <i class="fa-solid fa-play"></i>
                        <span>Mulai latihan</span>
                    </button>

                    <button class="w-full bg-amber-50 hover:bg-amber-100 border-2 border-amber-500 text-amber-600 font-bold py-3.5 px-6 rounded-2xl transition flex items-center justify-center gap-2 text-base md:text-lg">
                        <i class="fa-solid fa-book-open"></i>
                        <span>Daftar Kamus Isyarat</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== HALAMAN 2: GAME / KUIS (DIV) ==================== -->
        <div id="page-game" class="w-full hidden">
            <!-- Header Permainan -->
            <div class="bg-amber-500 px-6 py-4 text-white flex justify-between items-center shadow-md">
                <button id="btn-exit" class="flex items-center gap-2 font-bold text-xs md:text-sm hover:opacity-80 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Akhiri Sesi</span>
                </button>
                <h2 class="font-bold text-sm md:text-lg tracking-wide">Test Susun Kata</h2>
                <div class="flex items-center gap-1.5 font-bold text-xs md:text-sm">
                    <i class="fa-regular fa-clock"></i>
                    <span>Time: 05:00</span>
                </div>
            </div>

            <!-- Konten Game -->
            <div class="p-6 md:p-8 space-y-6">
                <!-- Info Soal & Skor -->
                <div>
                    <div class="flex justify-between items-center font-bold text-xs md:text-sm text-gray-800 mb-2">
                        <span>Soal: 2/10</span>
                        <span>Score: 10</span>
                    </div>
                    <!-- Progress Bar Soal -->
                    <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden border border-amber-200">
                        <div class="bg-gradient-to-r from-amber-400 to-amber-500 h-full rounded-full w-[20%] transition-all duration-300"></div>
                    </div>
                </div>

                <!-- Kartu Pertanyaan / Karakter -->
                <div class="grid grid-cols-3 gap-3 md:gap-4 pt-2">
                    <!-- Card A -->
                    <div class="bg-amber-50/60 border-2 border-amber-400 rounded-2xl p-3 flex flex-col items-center justify-between shadow-sm min-h-[140px] md:min-h-[180px]">
                        <span class="text-4xl md:text-6xl font-black text-gray-900 my-auto">A</span>
                        <div class="w-full border-2 border-dashed border-amber-400 rounded-xl h-10 md:h-12 bg-amber-100/40"></div>
                    </div>
                    <!-- Card B -->
                    <div class="bg-amber-50/60 border-2 border-amber-400 rounded-2xl p-3 flex flex-col items-center justify-between shadow-sm min-h-[140px] md:min-h-[180px]">
                        <span class="text-4xl md:text-6xl font-black text-gray-900 my-auto">B</span>
                        <div class="w-full border-2 border-dashed border-amber-400 rounded-xl h-10 md:h-12 bg-amber-100/40"></div>
                    </div>
                    <!-- Card C -->
                    <div class="bg-amber-50/60 border-2 border-amber-400 rounded-2xl p-3 flex flex-col items-center justify-between shadow-sm min-h-[140px] md:min-h-[180px]">
                        <span class="text-4xl md:text-6xl font-black text-gray-900 my-auto">C</span>
                        <div class="w-full border-2 border-dashed border-amber-400 rounded-xl h-10 md:h-12 bg-amber-100/40"></div>
                    </div>
                </div>

                <!-- Slot Jawaban Kosong -->
                <div class="grid grid-cols-3 gap-3 md:gap-4 pt-4">
                    <div class="bg-amber-50/50 border-2 border-amber-400 rounded-2xl h-12 md:h-14"></div>
                    <div class="bg-amber-50/50 border-2 border-amber-400 rounded-2xl h-12 md:h-14"></div>
                    <div class="bg-amber-50/50 border-2 border-amber-400 rounded-2xl h-12 md:h-14"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- CDN jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            // Logika perpindahan div halaman menggunakan jQuery
            $('#btn-start').on('click', function() {
                $('#page-lobby').addClass('hidden');
                $('#page-game').removeClass('hidden');
            });

            $('#btn-exit').on('click', function() {
                $('#page-game').addClass('hidden');
                $('#page-lobby').removeClass('hidden');
            });
        });
    </script>
</body>
</html>
