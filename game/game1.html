<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype Game Pilihan Ganda - Responsive</title>
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <style>
        /* Mendefinisikan custom font bahasa isyarat (FSL)[cite: 2] */
        @font-face {
            font-family: 'SignLanguageFont';
            /* Sesuaikan URL di bawah dengan path lokasi file MccidFslFont2-Regular.ttf Anda[cite: 2] */
            src: local('Mccid Fsl Font 2 Regular'); 
        }
        
        .font-fsl {
            font-family: 'SignLanguageFont', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-800 flex items-center justify-center min-h-screen font-sans p-4">

    <!-- Container Utama: Akan menyesuaikan ukuran antara Mobile (max-w-sm) dan Desktop (max-w-4xl) -->
    <div class="bg-white w-full max-w-[360px] md:max-w-[900px] h-[640px] md:h-[600px] rounded-[2rem] overflow-hidden shadow-2xl flex flex-col relative transition-all duration-300">

        <!-- Header Bar -->
        <div class="bg-[#ff7a00] text-white px-5 py-4 grid grid-cols-2 md:grid-cols-3 items-center">
            <div class="flex items-center space-x-2 cursor-pointer font-bold text-sm md:text-base justify-self-start">
                <span>&larr;</span>
                <span>Akhiri Sesi</span>
            </div>
            
            <!-- Judul Header: Hanya muncul di Desktop -->
            <div class="hidden md:block font-bold text-2xl text-center justify-self-center">
                Test Pilihan Ganda
            </div>

            <div class="flex items-center space-x-1 font-bold text-sm md:text-base justify-self-end">
                <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Time: 05:00</span>
            </div>
        </div>

        <!-- Status Progress -->
        <div class="px-6 pt-5 pb-2">
            <div class="flex justify-between text-sm md:text-base font-bold text-gray-800 mb-2">
                <span id="soal-counter">Soal: 2/10</span>
                <span>Score: 10</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-orange-200 rounded-full h-3 md:h-4">
                <div class="bg-[#ffb000] h-3 md:h-4 rounded-full transition-all duration-300" style="width: 20%"></div>
            </div>
        </div>

        <!-- Area Konten Responsif (Soal & Opsi)[cite: 3] -->
        <!-- Mobile: flex-col (atas bawah), Desktop: md:flex-row (kiri kanan) -->
        <div class="px-6 mt-4 pb-6 flex-1 flex flex-col md:flex-row gap-4 md:gap-6">
            
            <!-- Area Soal (Kiri pada Desktop, Atas pada Mobile) -->
            <div class="bg-orange-50 border-2 border-[#ff7a00] rounded-2xl flex items-center justify-center w-full h-48 md:h-full md:w-1/2 shadow-sm">
                <h1 id="question-text" class="text-6xl md:text-8xl text-black text-center break-words px-4">Hand</h1>
            </div>

            <!-- Area Pilihan Ganda (Kanan pada Desktop, Bawah pada Mobile)[cite: 3] -->
            <!-- Mobile: grid 2 kolom, Desktop: flex vertikal -->
            <div class="grid grid-cols-2 md:flex md:flex-col gap-4 md:w-1/2 h-full">
                <button class="option-btn bg-orange-50 border-2 border-[#ff7a00] rounded-2xl h-24 md:flex-1 text-5xl md:text-4xl text-black flex items-center justify-center transition-all duration-200 focus:outline-none hover:bg-orange-100">A</button>
                <button class="option-btn bg-orange-50 border-2 border-[#ff7a00] rounded-2xl h-24 md:flex-1 text-5xl md:text-4xl text-black flex items-center justify-center transition-all duration-200 focus:outline-none hover:bg-orange-100">B</button>
                <button class="option-btn bg-orange-50 border-2 border-[#ff7a00] rounded-2xl h-24 md:flex-1 text-5xl md:text-4xl text-black flex items-center justify-center transition-all duration-200 focus:outline-none hover:bg-orange-100">C</button>
                <button class="option-btn bg-orange-50 border-2 border-[#ff7a00] rounded-2xl h-24 md:flex-1 text-5xl md:text-4xl text-black flex items-center justify-center transition-all duration-200 focus:outline-none hover:bg-orange-100">D</button>
            </div>
        </div>

    </div>

    <!-- Logika jQuery -->
    <script>
        $(document).ready(function() {
            let currentQuestion = 2;
            const totalQuestions = 10;

            // Fungsi untuk mengacak format soal dan jawaban[cite: 2]
            function randomizeDisplay() {
                // Reset styling validasi pada tombol kembali ke default oranye
                $('.option-btn')
                    .removeClass('border-green-500 bg-green-100 border-4')
                    .addClass('border-[#ff7a00] bg-orange-50 border-2');

                // Mengacak angka 0 atau 1
                let mode = Math.floor(Math.random() * 2);

                if (mode === 0) {
                    // Mode 0: Soal Text Normal, Jawaban Font Isyarat (FSL)[cite: 2]
                    $('#question-text').removeClass('font-fsl').text('Hand');
                    $('.option-btn').addClass('font-fsl');
                } else {
                    // Mode 1: Soal Font Isyarat (FSL), Jawaban Text Normal[cite: 2]
                    $('#question-text').addClass('font-fsl').text('Hand');
                    $('.option-btn').removeClass('font-fsl');
                }
                
                // Update text counter soal dan progress bar
                $('#soal-counter').text('Soal: ' + currentQuestion + '/' + totalQuestions);
                let progressPercentage = (currentQuestion / totalQuestions) * 100;
                $('.bg-\\[\\#ffb000\\]').css('width', progressPercentage + '%');
            }

            // Jalankan pengacakan saat halaman pertama kali dimuat
            randomizeDisplay();

            // Event saat tombol jawaban diklik
            $('.option-btn').on('click', function() {
                // 1. Reset border di semua tombol untuk menghindari multiple selection
                $('.option-btn')
                    .removeClass('border-green-500 bg-green-100 border-4')
                    .addClass('border-[#ff7a00] bg-orange-50 border-2');

                // 2. Berikan efek validasi (border berubah tebal & hijau) pada tombol yang diklik
                $(this)
                    .removeClass('border-[#ff7a00] bg-orange-50 border-2')
                    .addClass('border-green-500 bg-green-100 border-4');

                // 3. Logika "Pindah Screen" (Simulasi transisi setelah 1 detik)
                setTimeout(function() {
                    if(currentQuestion < totalQuestions) {
                        currentQuestion++;
                    } else {
                        currentQuestion = 1; // Reset saat mencapai akhir (hanya prototipe)
                    }
                    randomizeDisplay();
                }, 1000); 
            });
        });
    </script>
</body>
</html>
