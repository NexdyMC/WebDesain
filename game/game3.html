<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Susun Kata Isyarat — Game 3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Poppins',sans-serif;}
  .font-heading{font-family:'Baloo 2',cursive;}
  .nav-pill{transition:transform .15s ease;}
  .nav-pill:hover{transform:translateY(-2px);}
  .option-btn{transition:all .15s ease;}
  .option-btn:active{transform:scale(.97);}
  .option-btn:disabled{cursor:default;}
  .pop-in{animation:popIn .25s ease;}
  @keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  .confetti{position:fixed;top:-10px;width:10px;height:10px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-yellow-50 via-orange-50 to-amber-100">

<div id="confetti-container" class="pointer-events-none fixed inset-0 overflow-hidden z-50"></div>

<div class="min-h-screen flex flex-col">
  <header class="px-4 py-3 flex items-center justify-between gap-2 flex-wrap">
    <span class="font-heading text-xl md:text-2xl font-bold text-orange-700">🖐️ BelajarIsyarat</span>
    <nav class="flex gap-2 text-sm overflow-x-auto">
      <a href="game1.html" class="nav-pill px-3 py-1.5 rounded-full bg-white border-2 border-orange-200 text-orange-700 font-bold whitespace-nowrap">1. Tebak Huruf</a>
      <a href="game2.html" class="nav-pill px-3 py-1.5 rounded-full bg-white border-2 border-orange-200 text-orange-700 font-bold whitespace-nowrap">2. Cocokkan</a>
      <a href="game3.html" class="nav-pill px-3 py-1.5 rounded-full bg-orange-500 text-white font-bold whitespace-nowrap">3. Susun Kata</a>
      <a href="game4.html" class="nav-pill px-3 py-1.5 rounded-full bg-white border-2 border-orange-200 text-orange-700 font-bold whitespace-nowrap">4. Mode Cepat</a>
      <a href="game5.html" class="nav-pill px-3 py-1.5 rounded-full bg-white border-2 border-orange-200 text-orange-700 font-bold whitespace-nowrap">5. Benar/Salah</a>
    </nav>
  </header>

  <main class="flex-1 flex items-start justify-center px-4 pb-10">
    <div class="w-full max-w-xl">

      <div class="mt-2 mb-4">
        <div class="flex justify-between items-center mb-1.5 text-orange-800 font-bold">
          <span id="progress-label">Soal 1 / 5</span>
          <span id="score-label">⭐ Skor: 0</span>
        </div>
        <div class="h-2.5 w-full bg-orange-200 rounded-full overflow-hidden">
          <div id="progress-bar" class="h-full bg-orange-500 rounded-full transition-all duration-300" style="width:20%"></div>
        </div>
      </div>

      <section id="question-card" class="bg-white rounded-3xl shadow-lg border-4 border-orange-200 p-6 text-center">
        <h1 class="font-heading text-xl md:text-2xl font-bold text-orange-800 mb-4">Rangkaian isyarat ini membentuk kata apa?</h1>
        <div id="hand-sequence" class="flex justify-center items-end gap-2 md:gap-4 flex-wrap py-2"></div>

        <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-6"></div>

        <div id="feedback" class="hidden mt-5 rounded-2xl p-4 pop-in" aria-live="polite"></div>

        <button id="next-btn" class="hidden mt-5 w-full bg-orange-500 hover:bg-orange-600 text-white font-heading font-bold text-lg rounded-2xl py-3">Lanjut ➜</button>
      </section>

      <section id="end-card" class="hidden bg-white rounded-3xl shadow-lg border-4 border-orange-200 p-8 text-center">
        <p class="text-5xl mb-3">🎉</p>
        <h2 class="font-heading text-2xl font-bold text-orange-800 mb-2">Selesai!</h2>
        <p id="end-score" class="text-lg text-orange-700 font-bold mb-6"></p>
        <button id="restart-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-heading font-bold text-lg rounded-2xl py-3">Main Lagi 🔁</button>
      </section>

      <p class="text-center text-orange-700/70 text-sm leading-relaxed mt-4">Catatan: gambar tangan adalah ilustrasi contoh. Ganti dengan foto isyarat BISINDO/SIBI asli untuk penggunaan nyata.</p>
    </div>
  </main>
</div>

<script>
const LETTER_PATTERNS = {
  A: [1,0,0,0,0], B: [0,1,1,1,1], C: [1,1,0,0,0], D: [0,1,0,0,0],
  E: [0,0,0,0,0], F: [1,0,1,1,1], G: [1,1,1,0,0], H: [0,1,1,0,0],
  I: [0,0,0,0,1], J: [0,0,0,1,1],
};

// Kata dibentuk hanya dari huruf yang tersedia di atas (A,B,C,D,E,F,G,H,I,J)
const WORDS = ['HAI', 'GIGI', 'BIJI', 'BAJA', 'HAJI'];
const DISTRACTORS = ['DAGI', 'FAJA', 'CIBI', 'EDAH', 'JIBA', 'HABI', 'GABI', 'ICAH'];

function handSVG(pattern, size=64){
  const cols = [40, 66, 92, 118];
  let fingers = '';
  [1,2,3,4].forEach((idx, i) => {
    const up = pattern[idx];
    const h = up ? 66 : 20;
    const y = 100 - h;
    fingers += `<rect x="${cols[i]-9}" y="${y}" width="18" height="${h}" rx="9" fill="#FFEDD5" stroke="#C2410C" stroke-width="2.5"/>`;
  });
  const thumbUp = pattern[0];
  const thumbH = thumbUp ? 54 : 20;
  fingers += `<rect x="4" y="${120-thumbH}" width="18" height="${thumbH}" rx="9" fill="#FFEDD5" stroke="#C2410C" stroke-width="2.5" transform="rotate(-35 13 120)"/>`;
  return `<svg viewBox="0 0 160 190" width="${size}" height="${size*1.18}" xmlns="http://www.w3.org/2000/svg">
    <rect x="18" y="100" width="124" height="82" rx="28" fill="#FB923C" stroke="#C2410C" stroke-width="3.5"/>
    ${fingers}
  </svg>`;
}

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function confettiBurst(){
  const colors = ['#FB923C','#FACC15','#F97316','#FDE047','#EA580C'];
  const $c = $('#confetti-container').empty();
  for(let i=0;i<60;i++){
    $('<div class="confetti"></div>').css({
      left: (Math.random()*100)+'vw',
      background: colors[Math.floor(Math.random()*colors.length)],
      animationDuration: (1.6+Math.random()*1.2)+'s',
      animationDelay: (Math.random()*0.4)+'s'
    }).appendTo($c);
  }
  setTimeout(()=>$c.empty(), 3200);
}

let order = [], index = 0, score = 0, answered = false;

function startGame(){
  order = shuffle(WORDS);
  index = 0; score = 0; answered = false;
  $('#end-card').addClass('hidden');
  $('#question-card').removeClass('hidden');
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const word = order[index];
  $('#progress-label').text(`Soal ${index+1} / ${order.length}`);
  $('#score-label').text(`⭐ Skor: ${score}`);
  $('#progress-bar').css('width', `${((index+1)/order.length)*100}%`);

  const $seq = $('#hand-sequence').empty();
  word.split('').forEach(letter => {
    $seq.append(`<div class="flex flex-col items-center">${handSVG(LETTER_PATTERNS[letter])}<span class="text-xs text-orange-400 mt-1">?</span></div>`);
  });

  const wrongOptions = shuffle(DISTRACTORS).slice(0, 3);
  const options = shuffle([word, ...wrongOptions]);
  const $grid = $('#options-grid').empty();
  options.forEach(opt => {
    $(`<button class="option-btn bg-orange-50 hover:bg-orange-100 border-2 border-orange-300 text-orange-800 font-heading font-bold text-xl rounded-2xl py-4" data-word="${opt}">${opt}</button>`).appendTo($grid);
  });

  $('#feedback').addClass('hidden').empty();
  $('#next-btn').addClass('hidden');
}

$(document).on('click', '.option-btn', function(){
  if(answered) return;
  answered = true;
  const chosen = $(this).data('word');
  const correct = order[index];

  $('.option-btn').each(function(){
    const w = $(this).data('word');
    $(this).prop('disabled', true);
    if(w === correct){
      $(this).removeClass('bg-orange-50 border-orange-300').addClass('bg-green-100 border-green-500 text-green-700');
    } else if(w === chosen){
      $(this).removeClass('bg-orange-50 border-orange-300').addClass('bg-red-100 border-red-500 text-red-600');
    }
  });

  if(chosen === correct){
    score++;
    $('#feedback').removeClass('hidden bg-red-50 text-red-700').addClass('bg-green-50 text-green-700 rounded-2xl p-4')
      .html(`✅ <strong>Benar!</strong> Rangkaian isyarat itu membentuk kata <strong>${correct}</strong>.`);
  } else {
    $('#feedback').removeClass('hidden bg-green-50 text-green-700').addClass('bg-red-50 text-red-700 rounded-2xl p-4')
      .html(`❌ Kata yang benar adalah <strong>${correct}</strong>.`);
  }
  $('#score-label').text(`⭐ Skor: ${score}`);
  $('#next-btn').removeClass('hidden');
});

$('#next-btn').on('click', function(){
  index++;
  if(index < order.length){
    renderQuestion();
  } else {
    $('#question-card').addClass('hidden');
    $('#end-card').removeClass('hidden');
    $('#end-score').text(`Skor kamu: ${score} / ${order.length}`);
    confettiBurst();
  }
});

$('#restart-btn').on('click', startGame);

startGame();
</script>
</body>
</html>
